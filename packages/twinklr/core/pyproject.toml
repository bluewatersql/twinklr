[project]
name = "twinklr-core"
version = "0.2.0"
description = "Twinklr Core - AI-powered lighting sequencer for xLights"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "numba>=0.60.0",             # Explicit Python 3.12 compatible numba
    "librosa>=0.10.2,<0.11.0",   # Audio analysis
    "soundfile>=0.12",
    "scipy>=1.13",
    "pydantic>=2.6",
    "openai>=1.0.0",
    "setuptools>=65.0", # Required by librosa for pkg_resources
    "pyyaml>=6.0",
    "pytweening>=1.2",
    "zstandard>=0.21.0",
    "noise>=1.2",
    "easing-functions>=1.0.4",
    "bezier>=2024.6.20",
    "aiofiles>=25.1.0",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "mutagen>=1.47.0",           # Audio file tag extraction
    "pyacoustid>=1.3.0",         # AcoustID fingerprinting
    "musicbrainzngs>=0.7.1",     # MusicBrainz API client
    "g2p-en>=2.1.0",             # Grapheme-to-phoneme for English (includes CMUdict)
    "python-Levenshtein>=0.25.0", # Levenshtein distance for mismatch ratio
    "defusedxml>=0.7.1",          # Safe XML parsing (XXE/billion-laughs protection)
    "simpleeval>=1.0",             # Safe expression evaluation (replaces eval())
    "pillow>=12.1.0",              # Image generation/rendering (agents/assets); was only declared transitively via the root meta-package
    "imageio-ffmpeg>=0.6.0",       # Bundled ffmpeg fallback for local vision-evaluation frame sampling
]

[project.optional-dependencies]
stems = [
    # Demucs 4.1.0 is incompatible with Twinklr's NumPy 2 requirement on Intel macOS.
    # Keep the base package installable there; the runtime reports the explicit fallback.
    "demucs==4.1.0; sys_platform != 'darwin'",
    "demucs==4.1.0; sys_platform == 'darwin' and platform_machine != 'x86_64'",
]
anthropic = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0", # Async test support for cache system
    "ruff>=0.8.0",
    "mypy>=1.7",
    "types-pyyaml>=6.0",
    "matplotlib>=3.7",
    "pandas>=2.0"
]
# Heavy ML models for WhisperX and diarization (optional install)
ml = [
    "whisperx>=3.1.1",       # Lyrics transcription/alignment
    "torch==2.4.0",          # PyTorch (WhisperX compatible version)
    "torchaudio==2.4.0",     # Audio processing (WhisperX compatible version)
    "pyannote-audio>=3.1.0", # Speaker diarization
]
fe = [
    "sqlite-vec>=0.1.6",    # C-optimized vector search extension for SQLite
]
normalization = [
    "sentence-transformers>=3.0",  # Effect name embedding
    "scikit-learn>=1.4",           # Optional clustering backends
]
mir = [
    "beat-this==1.1.0", # Local-only beat/downbeat A/B; weights are not used in CI
]
mir-beats = [
    "beat-this==1.1.0", # Named extra used by the actionable missing-dependency error
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
